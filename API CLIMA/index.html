<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima no Bolso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="photo-section" aria-label="Previsão do tempo no celular">
        <div class="photo-canvas">
            <img class="cafe-photo" src="img/Celular em Destaque no Café Aconchegante (1).png" alt="Pessoa segurando um celular em uma cafeteria">
            <section class="weather-screen" aria-label="Tela de previsão do tempo">
                <header class="weather-header">
                    <div class="location-copy">
                        <p class="eyebrow">CLIMA AGORA</p>
                        <h1 id="cidade">São Paulo</h1>
                        <p id="localizacao">Brasil</p>
                    </div>
                    <span class="location-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4.1 4.1"/></svg>
                    </span>
                </header>

                <form id="busca-cidade" class="city-search" role="search">
                    <label class="visually-hidden" for="input">Buscar cidade</label>
                    <input id="input" type="search" placeholder="Buscar cidade" autocomplete="off">
                    <button id="buscar" type="submit" aria-label="Buscar cidade" title="Buscar cidade">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4.1 4.1"/></svg>
                    </button>
                </form>

                <div id="resultado" aria-live="polite">
                    <section class="current-weather" aria-label="Condição atual">
                        <p class="weather-summary">Parcialmente nublado</p>
                        <div class="temperature-row"><span class="weather-icon" data-weather-code="2" aria-hidden="true"></span><p class="temperature">24°</p></div>
                        <p class="high-low">Máx. 27° <span>/</span> Mín. 18°</p>
                    </section>
                    <section class="hourly-section" aria-label="Previsão por hora">
                        <h2>PRÓXIMAS HORAS</h2>
                        <div id="previsao-horas" class="hourly-list">
                            <div class="hour-item"><span>Agora</span><span class="weather-mark" data-weather-code="2"></span><strong>24°</strong></div>
                            <div class="hour-item"><span>14h</span><span class="weather-mark" data-weather-code="0"></span><strong>25°</strong></div>
                            <div class="hour-item"><span>15h</span><span class="weather-mark" data-weather-code="0"></span><strong>26°</strong></div>
                            <div class="hour-item"><span>16h</span><span class="weather-mark" data-weather-code="1"></span><strong>25°</strong></div>
                            <div class="hour-item"><span>17h</span><span class="weather-mark" data-weather-code="3"></span><strong>23°</strong></div>
                        </div>
                    </section>
                    <section class="weekly-section" aria-label="Previsão para os próximos dias">
                        <h2>PRÓXIMOS DIAS</h2>
                        <div id="previsao-semana" class="weekly-list">
                            <div class="day-item"><span>Hoje</span><span class="weather-mark" data-weather-code="2"></span><strong>27°</strong><small>18°</small></div>
                            <div class="day-item"><span>Sex</span><span class="weather-mark" data-weather-code="0"></span><strong>28°</strong><small>19°</small></div>
                            <div class="day-item"><span>Sáb</span><span class="weather-mark" data-weather-code="1"></span><strong>26°</strong><small>18°</small></div>
                            <div class="day-item"><span>Dom</span><span class="weather-mark" data-weather-code="61"></span><strong>23°</strong><small>17°</small></div>
                            <div class="day-item"><span>Seg</span><span class="weather-mark" data-weather-code="0"></span><strong>27°</strong><small>18°</small></div>
                        </div>
                    </section>
                    <section class="details-grid" aria-label="Detalhes do clima">
                        <div class="weather-detail"><span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5s-6.5 7-6.5 11.2a6.5 6.5 0 0 0 13 0C18.5 10.5 12 3.5 12 3.5Z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg></span><span class="detail-label">UMIDADE</span><strong id="umidade">68%</strong></div>
                        <div class="weather-detail"><span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M14 14.8V5.5a3 3 0 0 0-6 0v9.3a5 5 0 1 0 6 0Z"/><path d="M11 8v9"/><circle cx="11" cy="18" r="2"/></svg></span><span class="detail-label">SENSAÇÃO</span><strong id="sensacao">25°</strong></div>
                        <div class="weather-detail"><span class="detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M2 12h16a3 3 0 1 1-3 3"/><path d="M4 16h5"/></svg></span><span class="detail-label">VENTO</span><strong id="vento">12 <small>km/h</small></strong></div>
                    </section>
                    <p id="mensagem" class="weather-message"></p>
                </div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
